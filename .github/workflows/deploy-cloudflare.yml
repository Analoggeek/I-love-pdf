name: Deploy to Cloudflare Workers

# Har push par (main branch) build + deploy.
# Zaroori GitHub repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare API token (Workers/D1/R2/Queues edit)
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
# Optional (Worker ke andar set ho jaate hain):
#   SESSION_SECRET, ADMIN_EMAIL, GEMINI_API_KEY, TURNSTILE_SECRET
# Optional repo variable: SITE_URL (jaise https://tools.example.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Repo secrets CLOUDFLARE_API_TOKEN aur CLOUDFLARE_ACCOUNT_ID set karo (Settings → Secrets and variables → Actions). Guide: README-Cloudflare-HI.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Create/reuse Cloudflare resources (D1, R2, Queues)
        run: node scripts/cloudflare-bootstrap.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply all-in-one-pdf-tools --remote --config wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml 2>&1 | tee deploy.log

      - name: Sync Worker secrets (optional, from GitHub secrets)
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          set -uo pipefail
          updated=0
          for name in SESSION_SECRET ADMIN_EMAIL GEMINI_API_KEY TURNSTILE_SECRET; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config wrangler.toml > /dev/null
              echo "✓ Worker secret set: $name"
              updated=1
            else
              echo "• $name GitHub secret nahi mila — skip (Worker ke purane value par rahega)"
            fi
          done
          if [ "$updated" = "0" ]; then
            echo "::warning::SESSION_SECRET set nahi hai — login/account features band rahenge. GitHub repo secret add karke dobara run karo."
          fi

      - name: Health check
        run: |
          set -uo pipefail
          url=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "::warning::Deploy URL log se nahi mila; Cloudflare dashboard → Workers & Pages mein URL dekho."
            exit 0
          fi
          echo "Live URL: $url"
          for i in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 15 "$url/api/health" || true)
            if [ -n "$body" ]; then
              echo "GET $url/api/health → $body"
              break
            fi
            sleep 5
          done
          if [ -n "${SITE_URL:-}" ]; then echo "Custom domain: $SITE_URL"; fi
